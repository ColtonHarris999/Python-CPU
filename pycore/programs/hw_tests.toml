# ---------------------------------------------------------------------------
# GC acceptance gates (planning/gc_plan.md §10.2): the test set and plusargs
# of each gate that runs hardware tests. tools/gc_gates.py runs them through
# hw_tests.py and checks the results; `make pycore-gc-acceptance MODE=quick`
# runs G0-G8, MODE=full G0-G16. Run one set by hand with
#   python3.14 pycore/tools/hw_tests.py --gate G4 [--mode full] [names...]
# (logs under build/gc_gates/<gate>/; the checks are not applied there).
#
# Fields (a gate's tests are the union of its `sets`, or the gate table
# itself when it has none):
#   areas, names  tests in these areas, plus tests matching these globs;
#                 with neither, every test
#   exclude       globs to drop
#   core          single or twocore only
#   images        only kinds that boot a host-built image (run, trap,
#                 stdout, coderam)
#   baseline      only tests with a row in the G0 baseline
#                 (pycore/tests/data/gc_baseline_cycles.tsv)
#   plusargs      added to every run, ahead of each test's own (so they
#                 win); {out} is the run's own directory
#   configs       "CACHE_EN,LAT" entries, or "caching" for test-caching's four
#                 (default "1,4")
#   full          fields that replace the above in MODE=full
#   full_only     the gate runs only in MODE=full
# Gate-specific fields are described where they appear.
#
# Quick mode uses the per-PR [gc] area plus every gc-mutant-* fixture (G10
# runs the quick gates against each mutant, and those fixtures exist to kill
# one). Full mode adds [gc-long] and the existing tests.
# ---------------------------------------------------------------------------

# G1: with the collector off, every result and cycle count equals G0.
[gate.G1]
baseline = true
core = "single"
plusargs = "+GC_EN=0"
full = { core = "", configs = ["1,4", "caching"] }

# G4: every collection's dump (heap, roots, counters, run list) equals the
# gc_model.py oracle. `exit` adds a collection at halt to every existing
# image test in MODE=full; those must each collect at least once.
[gate.G4]
sets = [{ areas = ["gc"], names = ["gc-mutant-*"] }]
plusargs = "+GC_EN=1 +GC_ROOT_STASH=1 +MAX_CYCLES_SCALE=40 +GC_DUMP_EACH={out}"
full = { sets = [{ areas = ["gc", "gc-long"] }], configs = ["1,4", "0,4"] }

[gate.G4-exit]
full_only = true
baseline = true
images = true
plusargs = "+GC_EN=1 +GC_ROOT_STASH=1 +MAX_CYCLES_SCALE=40 +GC_AT_EXIT=1 +GC_DUMP_EACH={out}"
configs = ["1,4", "0,4"]

# G5: the shadow-heap checker's self-test must fire (and stop the run); then
# every GC gate log of the run is scanned for a use-after-free.
[gate.G5]
names = ["gc-verify-containers"]
plusargs = "+GC_EN=1 +GC_VERIFY_ONLY=1 +GC_SHADOW_SELFTEST=1 +MAX_CYCLES_SCALE=40 +GC_AT_EXIT=1"
full = { names = ["gc-verify-containers", "containers-two-core"] }

# G7: torture. Mode a collects whenever a run cannot satisfy an allocation
# (+GC_EVERY_N_RUNS=1) in a heap of 2.5x the test's peak occupancy; mode b
# collects every K instructions (+GC_AT_BOUNDARY_EVERY=K, K = a prime near
# instructions/50); mode c is mode a with +GC_POISON=1. Goldens hold; dumps
# match the oracle.
#   recipe_heap  keep the test's own +HEAP_DYN_BYTES (it is the condition
#                under test)
#   bump_cursor  no extra collections: the result depends on the bump
#                cursor or on a fill-until-OOM sequence
[gate.G7]
sets = [{ areas = ["gc"], names = ["gc-mutant-*"] }]
plusargs = "+GC_EN=1 +GC_ROOT_STASH=1 +GC_LOG=1 +GC_SITE_STATS=1 +GC_DUMP_EACH={out}"
modes = ["a"]
full = { sets = [{ areas = ["gc", "gc-long"] }, { baseline = true, images = true }], modes = ["b", "a", "c"] }
recipe_heap = [
    "gc-fragmented-alloc", "gc-fragmented-alloc-two-core",
    # Fills each grant to a _bi_heap_free() margin so the next growth answers
    # NEED_HEAP (G9 two-core rows 14/15/17).
    "gc-grant-churn-two-core",
    # The same margin fill before each _bi_code_new (G9 row 31).
    "gc-code-new-churn", "gc-code-new-churn-two-core",
    # +GC_AUTO=0: the skip-then-MemoryError sequence needs its own heap.
    "gc-release-zero-after-oom", "gc-release-zero-after-oom-two-core",
    # The overflow / recovery sequence is sized to the test's heap.
    "gc-live-exceeds-heap", "gc-live-exceeds-heap-two-core",
    "gc-memoryerror-*",
]
bump_cursor = [
    "heap-mark-release", "heap-release-stale-trap",
    # Fill-until-OOM, then drop: first-fit leaves a 64 B hole while the junk
    # chain is still live, so the last tuple traps 7.
    "gc-root-closure", "gc-mutant-8", "gc-mutant-27", "gc-mutant-34", "gc-mutant-36",
]

# G8: randomized differential fuzzing (pycore/tools/gc_fuzz.py).
[gate.G8]
seeds = 50
tops = ["single"]
full = { seeds = 1000, tops = ["single", "twocore"] }

# G11: steady state. At least 10 collections; over the last half live bytes
# stay within `limit` (`compile_limit` for compile loops) and free bytes do
# not fall by more than 1 KB.
[gate.G11]
full_only = true
names = ["gc-steady-*", "gc-compile-loop", "gc-compile-loop-two-core",
         "gc-compile-syntaxerror", "gc-compile-syntaxerror-two-core"]
plusargs = "+GC_EN=1 +GC_ROOT_STASH=1 +MAX_CYCLES_SCALE=40 +GC_LOG=1"
limit = 1024
compile_limit = 16384

# G12: G4 at every (CACHE_EN, MEM_LATENCY), then test-caching's configs with
# the collector on and a collection at exit (`caching_plusargs`).
[gate.G12]
full_only = true
areas = ["gc", "gc-long"]
plusargs = "+GC_EN=1 +GC_ROOT_STASH=1 +MAX_CYCLES_SCALE=40 +GC_DUMP_EACH={out}"
configs = ["0,1", "0,4", "0,30", "1,1", "1,4", "1,30"]
caching_plusargs = "+GC_EN=1 +GC_ROOT_STASH=1 +GC_AT_EXIT=1 +MAX_CYCLES_SCALE=40"

# G13: performance targets P3-P7 (pycore/docs/gc.md, Performance). P8 is
# scored over the G8 corpus.
[gate.G13]
full_only = true
names = ["gc-bench-full", "gc-bench-churn", "gc-bench-deep", "gc-bench-wide", "gc-compile-loop"]
plusargs = "+GC_EN=1 +GC_ROOT_STASH=1 +MAX_CYCLES_SCALE=40 +GC_LOG=1"

# G13 P1/P2: existing single-core image tests with the collector on. One that
# never collects matches G0 cycle for cycle; one that collects may add only
# its pause (plus 0.5%).
[gate.G13-p1]
full_only = true
baseline = true
images = true
core = "single"
plusargs = "+GC_EN=1 +GC_ROOT_STASH=1 +MAX_CYCLES_SCALE=40"
