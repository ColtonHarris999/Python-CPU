# Hardware tests, grouped by what they check.
#
#   make test-<area>          run one area on the default memory config
#   make test-hw              run every area
#   make test-caching         the memory-system gate (see hw_tests.py)
#   python3.14 pycore/tools/hw_tests.py --list [--area A]
#
# Each entry is one program run on the simulated hart. Fields:
#   kind      run (default): build with host CPython, the hart must return
#             what managed_entry() returns on the host
#             trap: the hart must stop with trap code `trap`
#             stdout: two-core console output must match img_<src>.stdout
#             coderam: run with every function placed in code RAM
#             container / container_boot / excore: prebuilt hex fixtures
#             make: a hand-written Makefile recipe, `target`
#   core      single (default) or twocore (hart + excore helper)
#   src       program pycore/programs/img_<src>.py; `file` names any other
#   cycles    MAX_CYCLES for the default config
#   plusargs  extra simulator plusargs
#   needs     make targets that generate the fixture first
#   legacy    the old make target name, when it is not pycore-img-<name>
#   xfail     a known bug, in words: the run must fail (XFAIL); a pass fails
#             the suite (XPASS) so the marker is removed with the fix
#
# The [gate.*] tables at the end are not areas: they are the GC acceptance
# gates' test sets (make pycore-gc-acceptance).

