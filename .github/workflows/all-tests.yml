name: All Tests

on:
  pull_request:
    branches:
      - main
    # `edited` is not in the default type set, so retargeting a stacked PR onto
    # main did not start a run and the required `all-tests` check could never
    # appear. Without it, a PR opened against another branch and later rebased
    # onto main has no CI history at all.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_hw:
        description: Run hardware jobs even if the diff looks docs-only
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      hw: ${{ steps.filter.outputs.hw }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_hw }}" != "false" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "hw=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: running hardware jobs"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "hw=true" >> "$GITHUB_OUTPUT"
            echo "no base SHA; running hardware jobs"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          FILES=$(git diff --name-only "$BASE"...HEAD || git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$FILES"
          # Markdown, planning notes, and license/ignore files skip hardware.
          # RTL, programs, tools, Makefile, Docker, and .github still run it.
          HW_FILES=""
          if [ -n "$FILES" ]; then
            HW_FILES=$(echo "$FILES" | grep -Ev '\.(md|txt|rst)$|^planning/|^LICENSE$|^\.gitignore$|^\.gitattributes$' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "hw=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$HW_FILES" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "hw=false" >> "$GITHUB_OUTPUT"
            echo "docs/planning-only change; skipping hardware jobs"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "hw=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Docs / planning only
        run: |
          echo "No RTL, programs, tools, Makefile, or workflow files changed."
          echo "Hardware regression is skipped for this update."

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.hw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: docker --version
      - run: make docker-python-tests

  rtl-unit:
    name: rtl-unit
    needs: changes
    if: needs.changes.outputs.hw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: make docker-rtl-unit

  container:
    name: container
    needs: changes
    if: needs.changes.outputs.hw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: make docker-container TEST_JOBS=2

  img:
    name: img
    needs: changes
    if: needs.changes.outputs.hw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: make docker-img TEST_JOBS=2

  two-core:
    name: two-core
    needs: changes
    if: needs.changes.outputs.hw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: make docker-two-core TEST_JOBS=2

  excore:
    name: excore
    needs: changes
    if: needs.changes.outputs.hw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make docker-excore

  # The architectural gates from memory_system_plan.md §6. Every other job
  # runs one configuration (CACHE_EN=1, MEM_LATENCY=4); these run the image
  # suite across the CACHE_EN 0-vs-1 transparency comparison and the
  # MEM_LATENCY sweep. A cache that changes a retired result, or a master
  # that assumed single-cycle memory, fails only here -- the L2-to-RAM
  # writeback bug fixed in #101 was invisible precisely because CI never ran
  # a second configuration.
  gates:
    name: gates
    needs: changes
    if: needs.changes.outputs.hw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: make docker-gates TEST_JOBS=2

  # Keep this job id/name so existing branch protection on "all-tests" still
  # matches. It is a gate over the path-filtered jobs, not a 3h monolith.
  all-tests:
    name: all-tests
    needs: [changes, docs, python, rtl-unit, container, img, two-core, excore, gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran
        run: |
          set -euo pipefail
          echo "docs_only=${{ needs.changes.outputs.docs_only }}"
          echo "hw=${{ needs.changes.outputs.hw }}"
          RESULTS='${{ toJSON(needs) }}'
          echo "$RESULTS"

          # Classification decides which jobs run, so it must succeed outright.
          test "${{ needs.changes.result }}" = "success"

          # Any job that ran must have passed. Checking for bad outcomes rather
          # than listing good ones means a newly added job is gated the moment
          # it appears in `needs` -- a hardcoded allow-list silently stops
          # gating whenever someone adds a job and forgets this block.
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled|timed_out)"'; then
            echo "::error::one or more required jobs did not pass"
            exit 1
          fi

          # Guard against a classify bug that skips everything and looks green.
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            test "${{ needs.docs.result }}" = "success"
          else
            for r in "${{ needs.python.result }}" "${{ needs.rtl-unit.result }}" \
                     "${{ needs.container.result }}" "${{ needs.img.result }}" \
                     "${{ needs.two-core.result }}" "${{ needs.excore.result }}" \
                     "${{ needs.gates.result }}"; do
              test "$r" = "success"
            done
          fi
